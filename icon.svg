<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="The Proving Ground">
  <title>The Proving Ground</title>

  <!--
    Vector redraw of icon24.png (the gamemode icon shown in GMod's gamemode
    list). Same design and same palette, sampled straight out of the PNG:
    purple frame, green/red team split, a left-facing tank, blocky TPG.

    Letterforms are paths, not text, so the file renders identically without
    any font installed.
  -->

  <defs>
    <clipPath id="tpg-field">
      <rect x="14" y="14" width="212" height="212" rx="14"/>
    </clipPath>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="240" height="240" rx="26" fill="#5818a7"/>

  <!-- Team field: green left, red right -->
  <g clip-path="url(#tpg-field)">
    <rect x="14" y="14" width="106" height="212" fill="#00ff21"/>
    <rect x="120" y="14" width="106" height="212" fill="#ff0000"/>
  </g>

  <!-- Tank, facing left -->
  <g transform="translate(0,-6)">
    <rect x="60" y="157" width="128" height="7" rx="3.5" fill="#000000" opacity="0.4"/>

    <!-- barrel: drawn before the turret so the breech end tucks behind it -->
    <rect x="30" y="72" width="80" height="9" rx="2" fill="#55707a"/>
    <rect x="20" y="67" width="20" height="19" rx="3" fill="#3e5a63"/>

    <!-- turret -->
    <path d="M100 96 L110 68 L156 68 L166 96 Z" fill="#7fae00"/>
    <rect x="126" y="59" width="18" height="10" rx="2" fill="#65911f"/>

    <!-- hull -->
    <path d="M46 122 L64 96 L196 96 L202 122 Z" fill="#73a000"/>
    <rect x="64" y="96" width="132" height="6" fill="#8fb800"/>
    <rect x="168" y="96" width="28" height="15" fill="#ab6000"/>

    <!-- tracks -->
    <path d="M76 116 H172 A20 20 0 0 1 172 156 H76 A20 20 0 0 1 76 116 Z" fill="#2b2b2b"/>
    <path d="M80 122 H168 A14 14 0 0 1 168 150 H80 A14 14 0 0 1 80 122 Z" fill="#404040"/>

    <circle cx="66" cy="136" r="13" fill="#4a4a4a" stroke="#1e1e1e" stroke-width="3"/>
    <circle cx="182" cy="136" r="13" fill="#4a4a4a" stroke="#1e1e1e" stroke-width="3"/>

    <g fill="#a3b000">
      <circle cx="88" cy="141" r="7.5"/>
      <circle cx="109" cy="141" r="7.5"/>
      <circle cx="130" cy="141" r="7.5"/>
      <circle cx="151" cy="141" r="7.5"/>
    </g>
  </g>

  <!--
    TPG. Built from plain rects on a 13-unit stroke rather than one clever
    path each: the counters (the hole in the P, the gap and tongue of the G)
    are the whole reason the letters read at 24px, and stated as rects they
    can't quietly close up the way a mis-signed path segment does.
  -->
  <g fill="#0094ff">
    <!-- T -->
    <rect x="34" y="170" width="52" height="13"/>
    <rect x="53" y="170" width="14" height="52"/>

    <!-- P -->
    <rect x="96" y="170" width="14" height="52"/>
    <rect x="96" y="170" width="48" height="13"/>
    <rect x="130" y="170" width="14" height="23"/>
    <rect x="96" y="193" width="48" height="13"/>

    <!-- G -->
    <rect x="152" y="170" width="54" height="13"/>
    <rect x="152" y="170" width="14" height="52"/>
    <rect x="152" y="209" width="54" height="13"/>
    <rect x="193" y="196" width="13" height="26"/>
    <rect x="178" y="196" width="28" height="13"/>
  </g>
</svg>
