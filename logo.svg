<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="The Proving Ground">
  <title>The Proving Ground</title>

  <!--
    Wide banner built from the same art as icon.svg (which is itself a vector
    redraw of icon24.png, the gamemode icon). The badge and the big TPG are
    the same geometry drawn once in <defs> and placed twice, so the two files
    can't drift apart into slightly-different logos.

    Everything except the subtitle is paths, so it renders with no fonts
    installed. The subtitle stays real text because it should be selectable,
    and it's the one element small enough that a fallback face is fine.
  -->

  <defs>
    <clipPath id="tpg-field">
      <rect x="14" y="14" width="212" height="212" rx="14"/>
    </clipPath>

    <!-- Tank, facing left. Drawn on the icon's 240x240 grid. -->
    <g id="tpg-tank">
      <rect x="60" y="157" width="128" height="7" rx="3.5" fill="#000000" opacity="0.4"/>

      <rect x="30" y="72" width="80" height="9" rx="2" fill="#55707a"/>
      <rect x="20" y="67" width="20" height="19" rx="3" fill="#3e5a63"/>

      <path d="M100 96 L110 68 L156 68 L166 96 Z" fill="#7fae00"/>
      <rect x="126" y="59" width="18" height="10" rx="2" fill="#65911f"/>

      <path d="M46 122 L64 96 L196 96 L202 122 Z" fill="#73a000"/>
      <rect x="64" y="96" width="132" height="6" fill="#8fb800"/>
      <rect x="168" y="96" width="28" height="15" fill="#ab6000"/>

      <path d="M76 116 H172 A20 20 0 0 1 172 156 H76 A20 20 0 0 1 76 116 Z" fill="#2b2b2b"/>
      <path d="M80 122 H168 A14 14 0 0 1 168 150 H80 A14 14 0 0 1 80 122 Z" fill="#404040"/>

      <circle cx="66" cy="136" r="13" fill="#4a4a4a" stroke="#1e1e1e" stroke-width="3"/>
      <circle cx="182" cy="136" r="13" fill="#4a4a4a" stroke="#1e1e1e" stroke-width="3"/>

      <g fill="#a3b000">
        <circle cx="88" cy="141" r="7.5"/>
        <circle cx="109" cy="141" r="7.5"/>
        <circle cx="130" cy="141" r="7.5"/>
        <circle cx="151" cy="141" r="7.5"/>
      </g>
    </g>

    <!-- TPG, 13-unit stroke, spanning x 34..206 / y 170..222. -->
    <g id="tpg-word">
      <rect x="34" y="170" width="52" height="13"/>
      <rect x="53" y="170" width="14" height="52"/>

      <rect x="96" y="170" width="14" height="52"/>
      <rect x="96" y="170" width="48" height="13"/>
      <rect x="130" y="170" width="14" height="23"/>
      <rect x="96" y="193" width="48" height="13"/>

      <rect x="152" y="170" width="54" height="13"/>
      <rect x="152" y="170" width="14" height="52"/>
      <rect x="152" y="209" width="54" height="13"/>
      <rect x="193" y="196" width="13" height="26"/>
      <rect x="178" y="196" width="28" height="13"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="26" fill="#5818a7"/>

  <!-- Badge -->
  <g transform="translate(14,10)">
    <g clip-path="url(#tpg-field)">
      <rect x="14" y="14" width="106" height="212" fill="#00ff21"/>
      <rect x="120" y="14" width="106" height="212" fill="#ff0000"/>
    </g>
    <!--
      No TPG inside the badge here: the wordmark is already sitting right
      next to it, and printing the same three letters twice just made the
      badge look like a cropped copy of the icon. The freed space goes to
      the tank, centred in the field instead of pushed up by the letters.
    -->
    <g transform="translate(0,13)"><use href="#tpg-tank"/></g>
  </g>

  <!-- Wordmark: same letters, scaled up out of the badge -->
  <g transform="translate(300,44) scale(2.3) translate(-34,-170)">
    <use href="#tpg-word" fill="#0094ff"/>
  </g>

  <!-- Team rule under the wordmark -->
  <rect x="300" y="196" width="197" height="7" rx="3.5" fill="#00ff21"/>
  <rect x="503" y="196" width="197" height="7" rx="3.5" fill="#ff0000"/>

  <text x="300" y="236" font-family="'Arial Black', Impact, 'Franklin Gothic Bold', sans-serif"
        font-size="30" letter-spacing="3.5" fill="#ffffff">THE PROVING GROUND</text>
</svg>
